name: CI/CD Pipeline 

#Disparador 
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  #stage Build
  build:
    name: Build & Analize
    runs-on: ubuntu-latest

    setps: 
      - name: Checkout code
        uses: actions/checkout@
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Instalacion de dependencias
        run: flutter pub get

      - name: Analisis de codigo
  test: 
    name: Pruebas Unitarias
    run-on: ubuntu-latest  
    needs: build #Espera a que se ejecute build
    setps: 
      - name: Checkout code
        uses: actions/checkout@
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Instalacion de dependencias
        run: flutter pub get
      - name: Ejecucion de pruebas Unitarias
        run: flutter test --coverage
  artifacts:
    name: Construccion del APK
    runs-on: ubuntu-latest
    needs: test #Espera a que se ejecute test
    setps: 
      - name: Checkout code
        uses: actions/checkout@
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Instalacion de dependencias
        run: flutter pub get
      
      - name: Construccion Web
        run: flutter build apk --release
      - name: Subir Web
        uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web/
      - name: Construccion del APK
        run: flutter build apk --release
      - name: Subir APK 
        uses: actions/upload-artifact@v4
        with: 
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
